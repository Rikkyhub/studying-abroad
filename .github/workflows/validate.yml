name: Validate study-abroad tracker
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CSV trackers
        run: python3 scripts/validate_data.py
      - name: Reject private transaction fields in public CSV
        run: python3 scripts/check_public_data.py
      - name: Test public-data guard
        run: python3 -m unittest discover -s tests -p 'test_public_data.py'
