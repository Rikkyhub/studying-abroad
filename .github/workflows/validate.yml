name: Validate study-abroad tracker
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CSV schemas
        run: python3 scripts/validate_data.py
      - name: Reject private transaction fields in public CSV
        run: python3 scripts/check_public_data.py
      - name: Check generated files (AUTO blocks + HTML) match CSV and Markdown
        run: python3 scripts/build_all.py --check
      - name: Check local links
        run: python3 scripts/check_links.py
      - name: Unit tests (public-data guard, aggregation, HTML, page audit)
        run: python3 -m unittest discover -s tests -v

  regenerate-pr64-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 64 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild generated artifacts on existing PR branch
        run: |
          python3 scripts/build_all.py
          python3 scripts/build_all.py --check
          python3 scripts/validate_data.py
          python3 scripts/check_public_data.py
          python3 scripts/check_links.py
          python3 -m unittest discover -s tests -q
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "build: synchronize generated artifacts for PR 64"
            git push origin HEAD:refs/heads/research/gap-fill-20261021
          fi
