name: Validate study-abroad tracker
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CSV schemas
        run: python3 scripts/validate_data.py
      - name: Reject private transaction fields in public CSV
        run: python3 scripts/check_public_data.py
      - name: Check generated files (AUTO blocks + HTML) match CSV and Markdown
        run: python3 scripts/build_all.py --check
      - name: Check local links
        run: python3 scripts/check_links.py
      - name: Unit tests (public-data guard, aggregation, HTML, page audit)
        run: python3 -m unittest discover -s tests -v
